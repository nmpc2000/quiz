*{box-sizing:border-box}
body{margin:0;font:17px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:560px;padding:20px}
.card{background:var(--c);border-radius:18px;padding:20px;box-shadow:0 4px 20px #0001}
h1,h2{margin:.2em 0 .5em}
.sec{color:var(--p);font-weight:700;font-size:.8em;text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(135deg,var(--y1),var(--y2));color:#3b2f05;cursor:pointer;margin:4px 4px 4px 0}
button.o{background:var(--bg);color:var(--t);border:2px solid #e8c547}
button.on{background:linear-gradient(135deg,var(--y1),var(--y2));color:#3b2f05;border-color:transparent}
button.w{display:block;width:100%;text-align:left}
button.sel{opacity:.35}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid #e8c547;background:var(--bg);color:var(--t);margin:6px 0}
#body>img{max-height:60vh;object-fit:contain}
input[type=range]{padding:0;border:0;margin:8px 0;accent-color:#fcc419;background:none}
.big{font-size:3.4em;text-align:center;margin:10px 0}
img{max-width:100%;border-radius:12px;display:block;margin:10px auto}
.fb{margin-top:12px;font-weight:600}.ok{color:var(--ok)}.no{color:var(--no)}
.bar{height:6px;background:#e8c54744;border-radius:9px;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--y2);border-radius:9px}
.ans{min-height:50px;border:2px dashed #e8c547;border-radius:12px;padding:6px;margin:8px 0}
.ans span{display:inline-block;margin:2px 6px 2px 0;font-weight:700}
.m{color:var(--m);font-size:.9em}
#yt{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style></head>

const $=s=>document.querySelector(s);
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
const hit=(v,a)=>a.some(x=>norm(x)==norm(v));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const vid=u=>(String(u).match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/)||[0,String(u).length==11?u:""])[1];
const EXT=["png","jpg","jpeg","webp"];
function imgErr(e){const k=+e.dataset.x+1;if(k<EXT.length){e.dataset.x=k;e.src=e.dataset.b+"."+EXT[k]}else e.outerHTML=e.dataset.f}
const im=(b,f,st="")=>`<img src="${b}.png" data-b="${b}" data-x="0" data-f="${f.replace(/"/g,"&quot;")}" alt="" style="${st}" onerror="imgErr(this)">`;
const cell=v=>{const[n,u]=v.split("|");return u?im(u,n,"height:90px;margin:0"):n};
const media=q=>(q.yt!=null?(vid(q.yt)?'<div id="yt"></div><div><button class="o ctl" id="pl">▶ Ouvir</button><button class="o ctl" id="bk">⏪ 10 s</button><button class="o ctl" id="fw">10 s ⏩</button> <span id="tm" class="m">0:00 / 0:00</span></div><input type="range" id="sk" min="0" max="100" step="0.1" value="0">':'<p class="m">🎧 Falta o link do YouTube desta pergunta</p>'):"")+(q.img?im(q.img,`<div class=big>${q.e||"🖼️"}</div>`):(q.e?`<div class="big">${q.e}</div>`:""));
const inp=(id,ph)=>`<input id="${id}" placeholder="${ph}" autocomplete="off">`;
const max=Z=>Z.reduce((s,q)=>s+(q.t=="lofi"?2:q.t=="clues"?5:q.p||1),0);
let Z,i,res,mode;
const sc=()=>res.reduce((a,r)=>a+(r?r.g:0),0);
function go(d){i+=d;show()}
document.addEventListener("keydown",e=>{if(e.key=="Enter")$("#ok")?.click()});

function ytInit(q){
 const id=vid(q.yt||"");if(!id||!$("#yt"))return;
 const lo=q.st||0,fmt=t=>(t/60|0)+":"+String(t%60|0).padStart(2,"0");
 const mk=()=>{
  let drag=0,tick;
  const v={playsinline:1,rel:0,start:lo};if(q.en)v.end=q.en;
  const p=new YT.Player("yt",{width:1,height:1,videoId:id,playerVars:v,events:{onStateChange:e=>{const pl=$("#pl");if(pl&&e.data===1)pl.textContent="⏸ Pausa";else if(pl&&(e.data===2||e.data===0))pl.textContent="▶ Ouvir"}}});
  const H=()=>q.en||p.getDuration()||0;
  $("#pl").onclick=()=>{try{if(p.getPlayerState()===1)p.pauseVideo();else{if(p.getCurrentTime()>=H()-.5)p.seekTo(lo,true);p.playVideo()}}catch(e){}};
  $("#bk").onclick=()=>{try{p.seekTo(Math.max(lo,p.getCurrentTime()-10),true)}catch(e){}};
  $("#fw").onclick=()=>{try{p.seekTo(Math.min(H(),p.getCurrentTime()+10),true)}catch(e){}};
  const sk=$("#sk");
  sk.oninput=()=>{drag=1;$("#tm").textContent=fmt(Math.max(0,+sk.value-lo))+" / "+fmt(Math.max(0,H()-lo))};
  sk.onchange=()=>{try{p.seekTo(+sk.value,true)}catch(e){}drag=0};
  tick=setInterval(()=>{const s=$("#sk");if(!s){clearInterval(tick);return}
   try{const h=H(),t=p.getCurrentTime();s.min=lo;s.max=h;if(!drag)s.value=t;if(!drag)$("#tm").textContent=fmt(Math.max(0,t-lo))+" / "+fmt(Math.max(0,h-lo))}catch(e){}},250);
 };
 if(window.YT&&YT.Player)mk();else{window.onYouTubeIframeAPIReady=mk;if(!window.ytl){window.ytl=1;const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s)}}
}
function home(){
 mode="";
 $("#app").innerHTML=`<div class="card"><h1>🎂 Quiz de Anos</h1><p>Escolhe como queres jogar.</p><button class="w" onclick="start(BANK.filter(q=>q.b),'a')">🎂 Aniversário</button><button class="w o" onclick="rnd()">🎲 Aleatório</button></div>`;
}
function rnd(){
 const S=new Set(),T={},O=["Música","Cinema e Séries","Livros"];
 BANK.forEach(q=>q.g.split(",").forEach(t=>{(T[q.s]=T[q.s]||new Set()).add(t)}));
 const d=()=>{
  $("#app").innerHTML=`<div class="card"><h1>🎲 Aleatório</h1><p class="m">Escolhe bandas, géneros, autores ou sagas. Sem escolha, entra tudo. Até 10 perguntas por secção.</p>`+O.map(s=>`<div class="sec">${s}</div><div>${[...T[s]].map(t=>`<button class="o${S.has(t)?" on":""}" data-t="${t}">${t}</button>`).join("")}</div>`).join("")+`<br><button id="go">Começar</button><button class="o" onclick="home()">Voltar</button></div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=b.dataset.t;S.has(t)?S.delete(t):S.add(t);d()});
  $("#go").onclick=()=>{const p=BANK.filter(q=>!S.size||q.g.split(",").some(t=>S.has(t)));start(O.flatMap(s=>shuf(p.filter(q=>q.s==s)).slice(0,10)),"r")};
 };d();
}
function start(list,m){Z=list;mode=m;i=0;res=[];show()}
function show(){
 if(i>=Z.length)return end();
 const q=Z[i];
 $("#app").innerHTML=`<div class="card"><div class="bar"><i style="width:${i/Z.length*100}%"></i></div><div class="sec" style="margin:0">${q.s} · ${i+1}/${Z.length}</div><h2>${q.q}</h2><div id="body"></div><div id="fb" class="fb"></div><div><button class="o" onclick="go(-1)"${i?"":" disabled"}>← Anterior</button><button onclick="go(1)">${i+1<Z.length?"Seguinte →":"Ver resultado"}</button></div></div>`;
 R[q.t](q);ytInit(q);
 if(res[i]){lock(res[i]);if(q.t=="clues")allClues(q)}
}
function lock(r){
 document.querySelectorAll("#body button:not(.ctl),#body input:not(#sk)").forEach(e=>e.disabled=true);
 $("#fb").innerHTML=`<span class="${r.g?"ok":"no"}">${r.m}</span>`;
}
function fin(gain,msg){res[i]={g:gain,m:msg};lock(res[i])}
const allClues=q=>{$("#body").innerHTML=q.c.map((c,k)=>`<p>💡 ${k+1}. ${c}</p>`).join("")};
function end(){
 const t=max(Z),f=sc()/t,u=Z.filter((_,k)=>!res[k]).length;
 $("#app").innerHTML=`<div class="card"><h1>${sc()} / ${t} pontos</h1>${u?`<p class="m">Ficaram ${u} pergunta(s) por responder.</p>`:""}<p>${f>.7?"Incrível! Sabes tudo! 🎉":f>.4?"Muito bem! 💖":"Foi giro na mesma! 😄"}</p>${mode=="a"?"<h2>Feliz aniversário! 🎂❤️</h2>":""}<button class="o" onclick="i=Z.length-1;show()">← Rever perguntas</button><button onclick="home()">Voltar ao início</button></div>`;
}

const R={
text(q){
 $("#body").innerHTML=media(q)+inp("x","A tua resposta")+'<button id="ok">Responder</button>';
 $("#ok").onclick=()=>{const g=hit($("#x").value,q.a);fin(g?q.p||1:0,g?"✅ Certo! +"+(q.p||1):"❌ Era: "+q.a[0])};
},
lofi(q){
 $("#body").innerHTML=media(q)+inp("x","Nome da música")+inp("y","Cantor/banda")+'<button id="ok">Responder</button>';
 $("#ok").onclick=()=>{const g=hit($("#x").value,q.a)+hit($("#y").value,q.r);fin(g,(g?"✅ +"+g+" · ":"❌ ")+q.a[0]+" — "+q.r[0])};
},
multi(q){
 $("#body").innerHTML=media(q)+shuf(q.o).map(o=>`<button class="o w">${o}</button>`).join("");
 document.querySelectorAll("#body button").forEach(b=>b.onclick=()=>{const g=b.textContent==q.a[0];fin(g?q.p||1:0,g?"✅ Certo! +1":"❌ Era: "+q.a[0])});
},
clues(q){
 let n=0,note="";
 const draw=()=>{
  $("#body").innerHTML=q.c.slice(0,n+1).map((c,k)=>`<p>💡 ${k+1}. ${c}</p>`).join("")+`<p class="m">Vale ${Math.max(1,5-n)} pts${note}</p>`+inp("x","Quem/o quê?")+'<button id="ok">Responder</button>';
  $("#x").focus();
  $("#ok").onclick=()=>{
   const p=Math.max(1,5-n);
   if(hit($("#x").value,q.a)){fin(p,"✅ Certo! +"+p);return allClues(q)}
   if(n<q.c.length-1){n++;note=" · errado, nova pista!";draw()}else{fin(0,"❌ Era: "+q.a[0]);allClues(q)}
  };
 };
 draw();
},
order(q){const nm=q.items.map(v=>v.split("|")[0]);pick(q,q.items,s=>s.map(v=>v.split("|")[0]).join()==nm.join(),nm.join(" → "),q.p||2)},
scramble(q){pick(q,[...q.a[0].toUpperCase().replace(/ /g,"")],s=>norm(s.join(""))==norm(q.a[0]),q.a[0],q.p||1)}
};
function pick(q,items,test,solution,pts){
 const sh=shuf(items);let sel=[];
 const draw=()=>{
  $("#body").innerHTML=media(q)+`<div class="ans">${sel.map(k=>`<span>${cell(sh[k])}</span>`).join("")}</div><div>${sh.map((v,k)=>`<button class="o${sel.includes(k)?" sel":""}" data-k="${k}"${sel.includes(k)?" disabled":""}>${cell(v)}</button>`).join("")}</div><button id="ok">Confirmar</button><button class="o" id="rs">Limpar</button>`;
  document.querySelectorAll("#body [data-k]").forEach(b=>b.onclick=()=>{sel.push(+b.dataset.k);draw()});
  $("#rs").onclick=()=>{sel=[];draw()};
  $("#ok").onclick=()=>{const g=sel.length==sh.length&&test(sel.map(k=>sh[k]));fin(g?pts:0,g?"✅ Certo! +"+pts:"❌ Era: "+solution)};
 };
 draw();
}
home();
